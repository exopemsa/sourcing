<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMSA · Proyectos y servicios</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#203746;background:#f5f7f8;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dde5e8;padding:20px 32px;display:flex;align-items:center;gap:18px}header strong{font-size:23px;letter-spacing:-1px;color:#173f50}header span{color:#647780}main{max-width:1440px;margin:auto;padding:30px}h1{font-size:28px;letter-spacing:-.7px;margin:0}h2{font-size:19px;margin:0}p{line-height:1.6}.top,.section-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.actions{display:flex;flex-wrap:wrap;gap:8px}button,input,select{font:inherit}button{cursor:pointer;background:white;color:#203746;border:1px solid #cdd9de;border-radius:7px;padding:10px 14px;font-weight:600}button:hover{background:#edf4f3}button.primary{background:#194b58;color:white;border-color:#194b58}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6aada8;outline-offset:2px}input,select{border:1px solid #cdd9de;border-radius:6px;padding:10px;background:white;color:inherit;max-width:100%}.filters{display:flex;gap:16px;margin:20px 0;flex-wrap:wrap}.filters label{display:grid;gap:6px;font-size:12px;color:#526975;min-width:240px}.filters input{min-width:240px}.panel{background:white;border:1px solid #dde5e8;border-radius:10px;padding:22px;margin-bottom:22px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f1f5f6;color:#536b77;font-size:12px;font-weight:600;white-space:nowrap}th,td{padding:13px 14px;border-bottom:1px solid #e6edef;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.project-link{border:0;background:transparent;padding:5px 0;color:#176e6a;text-align:left;font-weight:650}.project-link:hover{text-decoration:underline;background:transparent}.empty{text-align:center;padding:54px 16px;color:#6d7e88}.empty strong{display:block;col <body>
<header><strong>EMSA</strong><span>Proyectos y servicios</span></header>
<main>
<div class="top"><h1 id="pageTitle">Proyectos</h1><div class="actions"><button id="importPai" class="primary">Importar PAI</button><button id="importServices">Importar servicios</button><button id="exportServices" disabled>Exportar servicios · Excel</button></div></div>
<input type="file" id="paiFile" accept=".xlsx,.xlsm" hidden><input type="file" id="servicesFile" accept=".xlsx,.xlsm" hidden>
<p id="status" class="status" role="status" aria-live="polite" hidden></p>
<div class="filters"><label>Filtrar proyecto<input id="projectFilter" type="search" placeholder="Nombre del proyecto" autocomplete="off"></label><label>Filtrar servicio<input id="serviceFilter" type="search" placeholder="Nombre o alcance del servicio" autocomplete="off"></label></div>
<section id="projectList" class="panel"><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Servicios</th></tr></thead><tbody id="projectsBody"></tbody></table></div></section>
<section id="projectDetail" hidden>
<button class="back" id="back">← Todos los proyectos</button>
<div class="panel"><div class="section-head"><div><h2 id="detailTitle"></h2><p class="muted">Los cambios se guardan en este navegador. Exporta el Excel para conservar una copia.</p></div><button id="addService" class="primary">Añadir servicio</button></div><div class="table-wrap"><table class="services"><thead><tr><th>Servicio</th><th>Alcance Servicio</th><th>LIC</th><th>Contrato</th><th>Empresa</th><th aria-label="Acciones"></th></tr></thead><tbody id="servicesBody"></tbody></table></div></div>
<div class="panel"><div class="section-head"><h2>Programación PAI</h2></div><div class="table-wrap" id="calendar"></div></div>
</section>
</main>
<dialog id="choiceDialog"><form method="dialog" id="choiceForm"><h2 id="choiceTitle"></h2><p id="choiceText"></p><label id="choiceLabel"></label><div class="actions"><button value="cancel" formnovalidate>Cancelar</button><button value="accept" class="primary">Continuar</button></div></form></dialog>

function serviceSheets(wb){

 for(const [name,sheet] of Object.entries(wb.sheets)){
  const rows=new Map();for(const [a,item] of Object.entries(sheet.cells)){const m=a.match(/^([A-Z]+)(\d+)$/);if(!m||+m[2]>90)continue;const row=+m[2];if(!rows.has(row))rows.set(row,[]);rows.get(row).push({c:P.colNum(m[1]),n:norm(item.v)})}

 }return matches;
}
async function importServices(file){

 const name=matches.length===1?matches[0].name:await choose('Selecciona los servicios','Elige la hoja con el listado que quieres actualizar.',matches.map(m=>m.name));if(!name){notify('Importación cancelada. Los datos actuales se conservaron.');return;}

  const values=indexes.map(c=>sheet.cells[P.addr(c,r)]?.v??'');if(values.every(v=>String(v).trim()===''))continue;
  if(indexes.some(c=>sheet.cells[P.addr(c,r)]?.t==='e'))throw Error(`La fila ${r} contiene un error de Excel. Corrígelo antes de importar.`);

  const id=norm(project),key=JSON.stringify([id,norm(service)]);if(seen.has(key))throw Error(`Servicio repetido en la fila ${r}: ${service} (${project}). Usa nombres de servicio únicos dentro de cada proyecto.`);seen.add(key);projects.set(id,project);

$('importPai').onclick=()=>$('paiFile').click();$('importServices').onclick=()=>$('servicesFile').click();
